name: Deploy to Cloudflare Workers

on:
  push:
    branches: [Main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Cloudflare Workers Build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL secret is missing"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
